[workspace]
name = "nanochat-cpp"
channels = ["conda-forge"]
# we primarily target sm120. require a cuda 13+ driver.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]

[dependencies]
# C++ toolchain
cuda-version = "13.2.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
cxx-compiler = "*"
gxx_linux-64 = "15.3.*"        # pins the gcc version cxx-compiler uses
cmake = ">=3.28"
ninja = "*"
pkg-config = "*"

# C++ libraries
gtest = "*"
libarrow = "*"
libparquet = "*"
nlohmann_json = "*"
pcre2 = "*"

# for running original nanochat comparisons.
python = "3.12.*"
pyarrow = "*"
numpy = "*"
regex = "*"
requests = "*"
filelock = "*"
psutil = "*"
tiktoken = "*"

# pytorch is 2.14 not on conda-forge yet (bundles cuda libs).
[pypi-dependencies]
rustbpe = "*"
safetensors = "*"
wandb = "*"
torch = { version = "==2.14.*", index = "https://download.pytorch.org/whl/cu132" }

[activation.env]
NANOCHAT_BASE_DIR = "$PIXI_PROJECT_ROOT/cache"

# these had a small improvement.
NCCL_PROTO = "Simple"
NCCL_MIN_NCHANNELS = "8"

# the following env vars are used as task variables.
BUILD_TYPE = "RelWithDebInfo"
TRAIN_BASE = "--nproc=2"
D12_BASE = "$TRAIN_BASE --depth=12 --device-batch-size=8"
D24_BASE = "$TRAIN_BASE --depth=24 --device-batch-size=2"
QUICK_BASE = "--eval-tokens=4194304 --eval-every=-1 --save=false"
# --rank-micro-steps=125,131

[tasks]
# empty CMAKE_CXX_FLAGS: drops conda's packaging CXXFLAGS (-O2, -march=nocona)
# empty NVCC_PREPEND_FLAGS: cuda-nvcc activation adds -ccbin, which CMake already passes
configure = { cmd = "cmake -S . -B cmake-build-pixi -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_FLAGS=", env = { NVCC_PREPEND_FLAGS = "" } }
build = { cmd = "cmake --build cmake-build-pixi", depends-on = ["configure"], env = { NVCC_PREPEND_FLAGS = "" } }
rebuild = "rm -rf cmake-build-pixi && pixi run build"

base-train = { cmd = "cmake-build-pixi/base_train", depends-on = ["build"] }

quick-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE $QUICK_BASE --num-iterations=30", depends-on = ["build"] }
quick-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE $QUICK_BASE --num-iterations=10", depends-on = ["build"] }

medium-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE $QUICK_BASE --num-iterations=100 --run=medium-d12", depends-on = ["build"] }
medium-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE $QUICK_BASE --num-iterations=30  --run=medium-d24", depends-on = ["build"] }

full-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE --wandb", depends-on = ["build"] }
full-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE --save-every=250 --wandb", depends-on = ["build"] }

profile-d12 = { cmd = "tools/profile.sh d12 $D12_BASE", depends-on = ["build"] }
profile-d24 = { cmd = "tools/profile.sh d24 $D24_BASE", depends-on = ["build"] }

test = { cmd = "ctest --test-dir cmake-build-pixi --output-on-failure", depends-on = ["build"] }

tok-train = { cmd = "cmake-build-pixi/tok_train", depends-on = ["build"] }
tok-eval = { cmd = "cmake-build-pixi/tok_eval", depends-on = ["build"] }

export-golden = "python tools/export_golden.py"
export-train-golden = "python tools/export_train_golden.py"
export-train-golden-ddp = "torchrun --standalone --nproc-per-node 2 tools/export_train_golden.py --sections train"
export-pretrained = "python tools/export_tokenizer.py --pretrained gpt2 cl100k_base"
wandb-upload = "python tools/wandb_upload.py"

# run a nanochat module against the shared cache, e.g. `pixi run nanochat nanochat.dataset -n 8`
nanochat = { cmd = "python -m", cwd = "external/nanochat" }
