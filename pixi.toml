[workspace]
name = "nanochat-cpp"
channels = ["conda-forge"]
# we're primarily targetting sm120. require a cuda 13+ driver.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]

[dependencies]
# C++ toolchain
cuda-version = "13.2.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
cxx-compiler = "*"
gxx_linux-64 = "15.3.*"        # pins the gcc version cxx-compiler uses
cmake = ">=3.28"
ninja = "*"
pkg-config = "*"

# C++ libraries
gtest = "*"
libarrow = "*"
libparquet = "*"
nlohmann_json = "*"
pcre2 = "*"

# for running original nanochat comparisons.
python = "3.12.*"
pyarrow = "*"
numpy = "*"
regex = "*"
requests = "*"
filelock = "*"
psutil = "*"
tiktoken = "*"

# pytorch is 2.14 not on conda-forge yet (bundles cuda libs).
[pypi-dependencies]
rustbpe = "*"
safetensors = "*"
torch = { version = "==2.14.*", index = "https://download.pytorch.org/whl/cu132" }

[activation.env]
NANOCHAT_BASE_DIR = "$PIXI_PROJECT_ROOT/cache"
PYTHONDONTWRITEBYTECODE = "1"  # keep the original nanochat tree untouched

[tasks]
# empty CMAKE_CXX_FLAGS drops conda's packaging CXXFLAGS (-O2, -march=nocona); the build type sets optimization
configure = "cmake -S . -B cmake-build-pixi -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_FLAGS="
build = { cmd = "cmake --build cmake-build-pixi", depends-on = ["configure"] }

test = { cmd = "ctest --test-dir cmake-build-pixi --output-on-failure", depends-on = ["build"] }
tok-train = { cmd = "cmake-build-pixi/tok_train", depends-on = ["build"] }
tok-eval = { cmd = "cmake-build-pixi/tok_eval", depends-on = ["build"] }

base-train = { cmd = "cmake-build-pixi/base_train", depends-on = ["build"] }
quick-train = { cmd = "cmake-build-pixi/base_train --nproc=2 --depth=12 --device-batch-size=8 --num-iterations=30 --eval-tokens=4194304 --run=quick --eval-every=-1 --save=false", depends-on = ["build"] }

export-golden = "python tools/export_golden.py"
export-train-golden = "python tools/export_train_golden.py"
export-train-golden-ddp = "torchrun --standalone --nproc-per-node 2 tools/export_train_golden.py --sections train"
export-pretrained = "python tools/export_tokenizer.py --pretrained gpt2 cl100k_base"

# run a nanochat module against the shared cache, e.g. `pixi run nanochat nanochat.dataset -n 8`
nanochat = { cmd = "python -m", cwd = "external/nanochat" }
