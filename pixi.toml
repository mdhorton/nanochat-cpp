[workspace]
name = "nanochat-cpp"
channels = ["conda-forge"]
# we primarily target sm120. require a cuda 13+ driver.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]

[dependencies]
# C++ toolchain
cuda-version = "13.2.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
cxx-compiler = "*"
gxx_linux-64 = "15.3.*"  # pins the gcc version cxx-compiler uses
cmake = ">=3.28"
ninja = "*"
pkg-config = "*"

# C++ libraries
cutlass = "4.8.*"        # headers only
gtest = "*"
libarrow = "*"
libparquet = "*"
nlohmann_json = "*"
pcre2 = "*"

# for running original nanochat comparisons.
python = "3.12.*"
pyarrow = "*"
numpy = "*"
regex = "*"
requests = "*"
filelock = "*"
psutil = "*"
tiktoken = "*"

# pytorch 2.14 is not on conda-forge yet (bundles cuda libs).
[pypi-dependencies]
rustbpe = "*"
safetensors = "*"
wandb = "*"
torch = { version = "==2.14.*", index = "https://download.pytorch.org/whl/cu132" }

[activation.env]
NANOCHAT_BASE_DIR = "$PIXI_PROJECT_ROOT/cache"

# these usually were the most consistant nccl flags.
NCCL_PROTO = "Simple"
NCCL_MIN_NCHANNELS = "8"
NCCL_CUMEM_HOST_ENABLE = "0"

# the following env vars are used as task variables.
BUILD_TYPE = "RelWithDebInfo"

# check the number of GPUs and vram. use these for defaults.
NPROC = "$(nvidia-smi -L 2>/dev/null | wc -l)"
VRAM_GB = "$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits 2>/dev/null | awk 'NR==1{print int($1 / 1024 + 0.5)}')"

TRAIN_BASE = "--nproc=$NPROC --eval-tokens=4194304"
D12_DBS = "2"
D24_DBS = "$(( ${VRAM_GB:-0} > 40 ? 8 : ${VRAM_GB:-0} >= 30 ? 4 : 2 ))"

D12_BASE = "$TRAIN_BASE --depth=12 --device-batch-size=$D12_DBS"
D24_BASE = "$TRAIN_BASE --depth=24 --device-batch-size=$D24_DBS"
QUICK_BASE = "--final-eval-tokens=4194304 --eval-every=-1 --save=false"

# --rank-micro-steps=125,131
# pixi run full-d24 > cache/full-d24.log 2>&1 < /dev/null &!

[tasks]
# empty CMAKE_CXX_FLAGS: drops conda's packaging CXXFLAGS (-O2, -march=nocona)
# empty NVCC_PREPEND_FLAGS: cuda-nvcc activation adds -ccbin, which CMake already passes
# build, rebuild: optional --warn-spills (register spill warnings; switching it recompiles the CUDA sources)
configure = { cmd = "cmake -S . -B cmake-build-pixi -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_FLAGS= -DNANOCHAT_WARN_SPILLS={{ 'ON' if opt == '--warn-spills' else 'OFF' }}", args = [{ arg = "opt", default = "" }], env = { NVCC_PREPEND_FLAGS = "" } }
build = { cmd = "cmake --build cmake-build-pixi", depends-on = [{ task = "configure", args = ["{{ opt }}"] }], args = [{ arg = "opt", default = "" }], env = { NVCC_PREPEND_FLAGS = "" } }
rebuild = { cmd = "rm -rf cmake-build-pixi && pixi run build {{ opt }}", args = [{ arg = "opt", default = "" }] }

base-train = { cmd = "cmake-build-pixi/base_train", depends-on = ["build"] }

quick-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE $QUICK_BASE --num-iterations=30", depends-on = ["build"] }
quick-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE $QUICK_BASE --num-iterations=30", depends-on = ["build"] }

medium-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE $QUICK_BASE --num-iterations=100 --run=medium-d12", depends-on = ["build"] }
medium-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE $QUICK_BASE --num-iterations=100 --run=medium-d24", depends-on = ["build"] }

full-d12 = { cmd = "cmake-build-pixi/base_train $D12_BASE --run=full-d12", depends-on = ["build"] }
full-d24 = { cmd = "cmake-build-pixi/base_train $D24_BASE --run=full-d24", depends-on = ["build"] }

profile-d12 = { cmd = "tools/profile.sh d12 $D12_BASE", depends-on = ["build"] }
profile-d24 = { cmd = "tools/profile.sh d24 $D24_BASE", depends-on = ["build"] }

test = { cmd = "cmake --build cmake-build-pixi --target nanochat_tests train_tests && ctest --test-dir cmake-build-pixi --output-on-failure", depends-on = ["build"], env = { NVCC_PREPEND_FLAGS = "" } }

tok-train = { cmd = "cmake-build-pixi/tok_train && python tools/import_tokenizer.py", depends-on = ["build", "dataset"] }
tok-eval = { cmd = "cmake-build-pixi/tok_eval", depends-on = ["build"] }

clone-nanochat = "test -d external/nanochat || (git clone https://github.com/karpathy/nanochat.git external/nanochat && git -C external/nanochat checkout 92d63d4)"
nanochat = { cmd = "python -m", cwd = "external/nanochat", depends-on = ["clone-nanochat"] }
dataset = { cmd = "python -m nanochat.dataset -n {{ n }}", cwd = "external/nanochat", args = [{ arg = "n", default = "10" }], depends-on = ["clone-nanochat"] }

# core-eval <run>
core-convert = { cmd = "python tools/convert_checkpoint.py cache/base_checkpoints/{{ run }} cache/base_checkpoints/{{ run }}-pt --to pt --model-only", args = [{ arg = "run" }] }
core-eval = { cmd = "torchrun --standalone --nproc_per_node=$NPROC -m scripts.base_eval --model-tag {{ run }}-pt --eval core {{ opt }}", cwd = "external/nanochat", args = [{ arg = "run" }, { arg = "opt", default = "" }], depends-on = [{ task = "clone-nanochat" }, { task = "core-convert", args = ["{{ run }}"] }] }

build-nccl-tests = "tools/build_nccl_tests.sh"
nccl-bench = { cmd = "python tools/nccl_bench.py", depends-on = ["build-nccl-tests"] }

export-golden = { cmd = "python tools/export_golden.py", depends-on = ["clone-nanochat"] }
export-train-golden = { cmd = "python tools/export_train_golden.py", depends-on = ["clone-nanochat"] }
export-train-golden-ddp = { cmd = "torchrun --standalone --nproc-per-node 2 tools/export_train_golden.py --sections train", depends-on = ["clone-nanochat"] }
export-pretrained = "python tools/export_tokenizer.py --pretrained gpt2 cl100k_base"
